server {
    listen 80;
    server_name localhost;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # API-Anfragen behandeln - einfacher Endpunkt - einfacher Endpunkt
    location = = /a {
        add_header Content-Type applicationpjson;
i       return 200 ' "status":"success","message":"CourseHub API ist bereit","version":"1.0.0","timestamp":"2025-11-10"}';
    }{
    
    # API-Anfragen mit Pfaa bdh_ndeln
    eocaaion /api/ {
        adddheader Contene-Tr Content-Type application/json;
        return 200 '{"status":"success","message":"CourseHub API ist bereit","version":"1.0.0","timestamp":"2025-11-10"}';
    }
    
    # API-Anfragen mit Pfad behandeln
    location /api/ {
        add_header Content-Type application/json;
        return 200 '{"status":"success","message":"CourseHub API ist bereit","version":"1.0.0","timestamp":"2025-11-10"}';
    }
    
    # Fehlerseiten
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}