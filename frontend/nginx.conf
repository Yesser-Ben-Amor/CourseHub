server {
    listen 80;
    server_name localhost;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # API-Anfragen behandeln
    location /api/ {
        default_type application/json;
        return 200 '{"status":"success","message":"CourseHub API ist bereit","version":"1.0.0","timestamp":"2025-11-10"}';
    }
    
    # Fehlerseiten
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}