version: '3.8'

services:
  # Frontend Service für Entwicklung - Einfaches Nginx-Image
  frontend-dev:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./frontend/dev-static:/usr/share/nginx/html
    networks:
      - coursehub-network
    restart: unless-stopped

  # Backend Service für Entwicklung - Einfaches Alpine-Image
  backend-dev:
    image: alpine:latest
    command: sh -c "echo '{\"status\":\"success\",\"message\":\"CourseHub API (Entwicklung) ist bereit\",\"version\":\"1.0.0\"}' > /tmp/api.json && while true; do sleep 1000; done"
    ports:
      - "8081:8080"
    networks:
      - coursehub-network
    restart: unless-stopped

  # Datenbank Service (gleich wie in der Hauptdatei)
  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=coursehub
      - MYSQL_USER=coursehub
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - coursehub-network
    restart: unless-stopped

# Volumes für persistente Daten
volumes:
  mysql-data:
  
# Netzwerk für die Kommunikation zwischen den Services
networks:
  coursehub-network:
    driver: bridge