version: '3.8'

services:
  # Frontend Service (Development Mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - coursehub-network
    restart: unless-stopped

  # Backend Service (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/coursehub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=coursehub
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8080:8080"
    volumes:
      - ~/.m2:/root/.m2
    depends_on:
      - db
    networks:
      - coursehub-network
    restart: unless-stopped

  # Datenbank Service
  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=coursehub
      - MYSQL_USER=coursehub
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - coursehub-network
    restart: unless-stopped

# Volumes für persistente Daten
volumes:
  mysql-data:

# Netzwerk für die Kommunikation zwischen den Services
networks:
  coursehub-network:
    driver: bridge